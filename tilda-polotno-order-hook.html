<!--
  Polotno Tilda order hook.

  What it does:
  - sends an order notification immediately when the buyer presses checkout/payment buttons;
  - works before Robokassa opens, so abandoned unpaid checkout attempts are also delivered;
  - uses navigator.sendBeacon first, then fetch keepalive fallback.

  Setup:
  1. Replace POLOTNO_SECRET with the same value as TILDA_ORDER_WEBHOOK_SECRET in Vercel.
  2. Put this block in Tilda -> Site Settings -> More -> HTML code before </body>.
  3. Keep TELEGRAM_BOT_TOKEN and TILDA_ORDER_CHAT_ID only in Vercel environment variables.
-->
<script>
(function () {
  "use strict";

  var POLOTNO_ENDPOINT = "https://polotno-three.vercel.app/api/alerts?action=tilda-order";
  var POLOTNO_SECRET = "hfisudfhiIFJEW4OY9HIU289y398khj";
  var sentFingerprints = {};

  function text(value) {
    return value == null ? "" : String(value).replace(/\s+/g, " ").trim();
  }

  function fieldKey(input) {
    return text(
      input.getAttribute("name") ||
      input.getAttribute("data-tilda-name") ||
      input.getAttribute("placeholder") ||
      input.getAttribute("id")
    );
  }

  function collectFormFields(form) {
    var fields = {};
    if (!form || !form.querySelectorAll) return fields;

    form.querySelectorAll("input, textarea, select").forEach(function (input) {
      var key = fieldKey(input);
      if (!key) return;

      if (input.type === "checkbox") {
        fields[key] = input.checked ? "yes" : "no";
        return;
      }

      if (input.type === "radio" && !input.checked) return;
      fields[key] = text(input.value);
    });

    return fields;
  }

  function getField(fields, names) {
    var keys = Object.keys(fields || {});
    for (var i = 0; i < names.length; i += 1) {
      var target = String(names[i]).toLowerCase();
      for (var j = 0; j < keys.length; j += 1) {
        if (keys[j].toLowerCase() === target && text(fields[keys[j]])) {
          return text(fields[keys[j]]);
        }
      }
    }
    return "";
  }

  function collectTildaCartProducts(cart) {
    var rawProducts = Array.isArray(cart.products) ? cart.products : [];
    return rawProducts.map(function (product) {
      return {
        name: text(product.name || product.title || product.product),
        quantity: text(product.quantity || product.qty || product.amount || 1),
        price: text(product.price || product.sum || product.total),
        sku: text(product.sku || product.code || product.barcode)
      };
    }).filter(function (product) {
      return product.name;
    });
  }

  function collectDomProducts() {
    var products = [];
    document.querySelectorAll(".t706__cartwin-product, .t706__product").forEach(function (row) {
      var nameNode = row.querySelector(".t706__cartwin-product-title, .t706__product-title, .t-name, .js-product-name");
      var quantityNode = row.querySelector(".t706__product-quantity, .t706__cartwin-prodamount, input[name='quantity']");
      var priceNode = row.querySelector(".t706__cartwin-product-price, .t706__product-price, .t-price");
      var name = text(nameNode && nameNode.textContent);
      if (!name) return;
      products.push({
        name: name,
        quantity: text(quantityNode && (quantityNode.value || quantityNode.textContent)) || "1",
        price: text(priceNode && priceNode.textContent),
        sku: ""
      });
    });
    return products;
  }

  function collectCart() {
    var cart = window.tcart || {};
    var products = collectTildaCartProducts(cart);
    if (!products.length) products = collectDomProducts();

    return {
      orderId: text(cart.orderid || cart.orderId || cart.paymentid),
      amount: text(cart.amount || cart.total || cart.prodamount),
      currency: text(cart.currency || "RUB"),
      products: products,
      delivery: cart.delivery || {}
    };
  }

  function closestBlockId(element) {
    var block = element && element.closest ? element.closest("[id^='rec']") : null;
    return block ? block.id : "";
  }

  function isOrderForm(form) {
    if (!form || !form.querySelectorAll) return false;
    if (form.closest(".t706, .t-popup, .t-form")) return true;
    return Boolean(form.querySelector("[name='Name'], [name='Email'], [name='Phone'], [name='Телефон']"));
  }

  function findCheckoutForm(element) {
    var form = element && element.closest ? element.closest("form") : null;
    if (form && isOrderForm(form)) return form;

    var visibleForms = Array.prototype.slice.call(document.querySelectorAll(".t706 form, .t-popup_show form, form"));
    return visibleForms.find(function (candidate) {
      if (!isOrderForm(candidate)) return false;
      var rect = candidate.getBoundingClientRect();
      return rect.width > 0 && rect.height > 0;
    }) || visibleForms.find(isOrderForm) || null;
  }

  function isCheckoutButton(element) {
    if (!element || !element.closest) return null;
    var button = element.closest("button, a, input[type='button'], input[type='submit'], .t-submit, .t706__submit, [role='button']");
    if (!button) return null;

    var label = text(button.innerText || button.value || button.getAttribute("aria-label") || button.getAttribute("title"));
    var className = String(button.className || "");
    var isKnownTildaButton = /t-submit|t706__submit/.test(className) || button.matches("button[type='submit'], input[type='submit']");
    var isCheckoutLabel = /оформить|заказ|оплат|robokassa|перейти|купить/i.test(label);
    return isKnownTildaButton || isCheckoutLabel ? button : null;
  }

  function buildPayload(form, reason) {
    var fields = collectFormFields(form);
    var cart = collectCart();
    var customerName = getField(fields, ["Name", "name", "Имя", "ФИО"]);
    var eventId = String(Date.now()) + "-" + Math.random().toString(36).slice(2);

    return {
      source: "tilda-checkout-click",
      checkoutReason: reason || "checkout",
      clientEventId: eventId,
      _polotnoSecret: POLOTNO_SECRET,
      secret: POLOTNO_SECRET,
      pageUrl: window.location.href,
      pageTitle: document.title,
      formName: text((form && form.getAttribute("data-formname")) || getField(fields, ["Form", "formname"])) || "Cart",
      blockId: closestBlockId(form),
      requestId: getField(fields, ["tildaspec-formid", "formid", "Код заявки"]),
      orderId: cart.orderId || getField(fields, ["orderid", "Order ID", "payment_id"]),
      customerName: customerName,
      email: getField(fields, ["Email", "email", "E-mail", "ma_email"]),
      phone: getField(fields, ["Phone", "phone", "Телефон"]),
      comment: getField(fields, ["Comment", "comment", "Комментарий"]),
      delivery: getField(fields, ["Delivery", "delivery", "Способ доставки"]) || text(cart.delivery.name),
      deliveryAddress: getField(fields, ["Address", "address", "Адрес доставки"]) || text(cart.delivery.address),
      amount: cart.amount || getField(fields, ["amount", "Сумма платежа", "payment_amount"]),
      currency: cart.currency || "RUB",
      paymentProvider: getField(fields, ["paymentProvider", "payment_system", "payment"]) || "Tilda",
      paymentCode: getField(fields, ["payment_id", "paymentid", "Код платежа"]) || cart.orderId,
      paymentStatus: getField(fields, ["paymentStatus", "payment_status"]),
      products: cart.products,
      fields: fields
    };
  }

  function fingerprint(payload) {
    return JSON.stringify({
      orderId: payload.orderId,
      phone: payload.phone,
      email: payload.email,
      amount: payload.amount,
      products: (payload.products || []).map(function (product) {
        return [product.name, product.quantity, product.price];
      })
    });
  }

  function rememberFingerprint(key) {
    sentFingerprints[key] = Date.now();
    Object.keys(sentFingerprints).forEach(function (item) {
      if (Date.now() - sentFingerprints[item] > 8000) {
        delete sentFingerprints[item];
      }
    });
  }

  function postPayload(payload) {
    var json = JSON.stringify(payload);
    var sentByBeacon = false;

    if (navigator.sendBeacon) {
      try {
        var blob = new Blob([json], { type: "text/plain;charset=UTF-8" });
        sentByBeacon = navigator.sendBeacon(POLOTNO_ENDPOINT, blob);
      } catch (error) {
        sentByBeacon = false;
      }
    }

    if (sentByBeacon) return;

    fetch(POLOTNO_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: json,
      keepalive: true
    }).catch(function (error) {
      console.warn("[Polotno] Failed to send order notification", error);
    });
  }

  function sendOrder(form, reason) {
    if (!POLOTNO_SECRET || POLOTNO_SECRET.indexOf("PASTE_") === 0) {
      console.warn("[Polotno] Set POLOTNO_SECRET in Tilda script.");
      return;
    }
    if (!form || !isOrderForm(form)) return;

    var payload = buildPayload(form, reason);
    var key = fingerprint(payload);
    if (sentFingerprints[key]) return;
    rememberFingerprint(key);
    postPayload(payload);
  }

  function handleCheckoutIntent(event) {
    var button = isCheckoutButton(event.target);
    if (!button) return;
    var form = findCheckoutForm(button);
    if (!form) return;
    sendOrder(form, event.type);
  }

  ["pointerdown", "touchstart", "mousedown", "click"].forEach(function (eventName) {
    document.addEventListener(eventName, handleCheckoutIntent, true);
  });

  document.addEventListener("submit", function (event) {
    var form = event.target;
    if (!(form instanceof HTMLFormElement) || !isOrderForm(form)) return;
    sendOrder(form, "submit");
  }, true);
})();
</script>
